apply plugin: 'java'
apply plugin: 'maven-publish'

group = pluginGroup
version = pluginVersion

sourceCompatibility = '1.8'
targetCompatibility = '1.8'

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
    maven { url "http://jcenter.bintray.com"}
    maven {
        name = 'spigotmc-repo'
        url = 'https://hub.spigotmc.org/nexus/content/groups/public/'
    }
    maven {
        name = 'sonatype'
        url = 'https://oss.sonatype.org/content/groups/public/'
    }
    maven { url "https://repo.dmulloy2.net/nexus/repository/public/" }
    maven {
        url 'http://maven.elmakers.com/repository/'
    }
    maven { url 'https://jitpack.io' }
}

configurations {
    // configuration that holds jars to include in the jar
    extraLibs
}

dependencies {
    testCompile group: 'junit', name: 'junit', version: '4.12'
    compile 'org.spigotmc:spigot:1.16.3-R0.1-SNAPSHOT'
    compile group: 'xyz.upperlevel.spigot.book', name: 'spigot-book-api', version: '1.3' //Waiting for 1.16
    compile 'com.github.stefvanschie.inventoryframework:IF:0.7.2'
    compile group: 'de.slikey', name:'EffectLib', version:'6.2' //Waiting for 1.16
    compileOnly group: "com.comphenix.protocol", name: "ProtocolLib", version: "4.5.0";
    implementation 'com.github.WesJD.AnvilGUI:anvilgui:master-SNAPSHOT'

    implementation files('libraries/CrazyAdvancementsAPI.jar')
    implementation files('libraries/ParticleProjectileApi.jar')
    implementation files('libraries/SoundAPI.jar')

    extraLibs  'org.mongodb:mongodb-driver:3.4.3'
    extraLibs group: 'xyz.upperlevel.spigot.book', name: 'spigot-book-api', version: '1.3'
    extraLibs 'com.github.stefvanschie.inventoryframework:IF:0.5.18'
    extraLibs 'com.github.WesJD.AnvilGUI:anvilgui:master-SNAPSHOT'
    implementation 'org.jetbrains:annotations:15.0'
}

import org.apache.tools.ant.filters.ReplaceTokens

task fatJar(type: Jar) {
    manifest {
        attributes 'Implementation-Title': 'Gradle Jar File Example',
                'Implementation-Version': version,
                'Main-Class': 'dandelion.oniris.Oniris'
    }
    baseName = project.name + '-all'
    from { configurations.compile.collect { it.isDirectory() ? it : zipTree(it) } }
    with jar
}

jar {
    from {
        configurations.extraLibs.collect { it.isDirectory() ? it : zipTree(it) }
    }
}

processResources {
    from(sourceSets.main.resources.srcDirs) {
        filter ReplaceTokens, tokens: [version: version]
    }
}
